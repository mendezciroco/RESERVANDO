<!-- Plano del predio de GOLES. Lógica en assets/js/plano.js -->
<!-- En Django: {% include "componentes/plano.html" %} -->
<!-- El SVG se dibuja desde arriba y una sola transformación lo pasa a vista isométrica -->
<section x-data="plano()" class="rounded-3xl bg-marca-oscuro p-4 font-texto text-marca-claro ring-1 ring-marca-claro/10" aria-labelledby="plano-titulo">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h2 id="plano-titulo" class="font-titulo text-2xl font-extrabold uppercase tracking-wide">El predio</h2>
      <p class="text-sm text-marca-claro/70" x-text="titular()">Elegí un día y un horario para ver qué cancha está libre.</p>
    </div>
    <span x-show="hora !== null" class="shrink-0 rounded-full bg-marca/15 px-3 py-1 text-sm font-semibold text-marca" x-text="hora !== null ? Fmt.hora(hora) : ''"></span>
  </div>

  <svg viewBox="0 0 136 100" class="mt-2 h-auto w-full select-none" role="group" aria-label="Plano del predio con la cancha F5 y la cancha F7">
    <g transform="matrix(0.866 0.5 -0.866 0.5 42 20)">
      <!-- Piso del predio -->
      <rect x="0" y="0" width="104" height="44" rx="2" stroke-width="0.4" class="fill-marca-claro/5 stroke-marca-claro/15"/>

      <!-- Cancha F5 -->
      <g role="button" tabindex="0" class="group cursor-pointer outline-none"
         :aria-label="etiqueta('f5')" :aria-pressed="elegida === 'f5'"
         @click="tocar('f5')" @keydown.enter.prevent="tocar('f5')" @keydown.space.prevent="tocar('f5')">
        <rect x="4.5" y="8.5" width="39" height="27" rx="2" fill="none" stroke-width="1.2"
              class="stroke-libre transition-opacity duration-500"
              :class="estado('f5') === 'libre' ? 'opacity-100 motion-safe:animate-pulse' : 'opacity-0'"/>
        <rect x="6" y="10" width="36" height="24" rx="1" class="transition-colors duration-500"
              :class="{ 'fill-libre': estado('f5') === 'libre', 'fill-slate-400': estado('f5') === 'ocupada', 'fill-libre/40': estado('f5') === 'neutro' }"/>
        <g class="fill-marca-oscuro/10">
          <rect x="12" y="10" width="6" height="24"/>
          <rect x="24" y="10" width="6" height="24"/>
          <rect x="36" y="10" width="6" height="24"/>
        </g>
        <g fill="none" stroke-width="0.5" class="stroke-marca-claro transition-opacity duration-500"
           :class="estado('f5') === 'ocupada' ? 'opacity-50' : 'opacity-90'">
          <rect x="7.5" y="11.5" width="33" height="21"/>
          <line x1="24" y1="11.5" x2="24" y2="32.5"/>
          <circle cx="24" cy="22" r="3.5"/>
          <path d="M7.5 17 A5 5 0 0 1 7.5 27"/>
          <path d="M40.5 27 A5 5 0 0 1 40.5 17"/>
        </g>
        <g class="fill-marca-claro">
          <circle cx="24" cy="22" r="0.5"/>
          <rect x="6" y="20.5" width="1.5" height="3"/>
          <rect x="40.5" y="20.5" width="1.5" height="3"/>
        </g>
        <!-- Contorno de elegida y de foco con teclado -->
        <rect x="4.5" y="8.5" width="39" height="27" rx="2" fill="none" stroke-width="1.6"
              class="stroke-marca opacity-0 transition-opacity group-focus-visible:opacity-100"
              :class="elegida === 'f5' && 'opacity-100'"/>
      </g>
      <text x="24" y="40" text-anchor="middle" font-size="3.2" font-weight="800" class="pointer-events-none fill-marca-claro font-titulo" x-text="rotulo('f5')">F5</text>

      <!-- Cancha F7 -->
      <g role="button" tabindex="0" class="group cursor-pointer outline-none"
         :aria-label="etiqueta('f7')" :aria-pressed="elegida === 'f7'"
         @click="tocar('f7')" @keydown.enter.prevent="tocar('f7')" @keydown.space.prevent="tocar('f7')">
        <rect x="48.5" y="2.5" width="51" height="39" rx="2" fill="none" stroke-width="1.2"
              class="stroke-libre transition-opacity duration-500"
              :class="estado('f7') === 'libre' ? 'opacity-100 motion-safe:animate-pulse' : 'opacity-0'"/>
        <rect x="50" y="4" width="48" height="36" rx="1" class="transition-colors duration-500"
              :class="{ 'fill-libre': estado('f7') === 'libre', 'fill-slate-400': estado('f7') === 'ocupada', 'fill-libre/40': estado('f7') === 'neutro' }"/>
        <g class="fill-marca-oscuro/10">
          <rect x="58" y="4" width="8" height="36"/>
          <rect x="74" y="4" width="8" height="36"/>
          <rect x="90" y="4" width="8" height="36"/>
        </g>
        <g fill="none" stroke-width="0.5" class="stroke-marca-claro transition-opacity duration-500"
           :class="estado('f7') === 'ocupada' ? 'opacity-50' : 'opacity-90'">
          <rect x="51.5" y="5.5" width="45" height="33"/>
          <line x1="74" y1="5.5" x2="74" y2="38.5"/>
          <circle cx="74" cy="22" r="5"/>
          <rect x="51.5" y="13" width="7" height="18"/>
          <rect x="89.5" y="13" width="7" height="18"/>
          <path d="M58.5 18.5 A4 4 0 0 1 58.5 25.5"/>
          <path d="M89.5 25.5 A4 4 0 0 1 89.5 18.5"/>
        </g>
        <g class="fill-marca-claro">
          <circle cx="74" cy="22" r="0.5"/>
          <circle cx="56" cy="22" r="0.4"/>
          <circle cx="92" cy="22" r="0.4"/>
          <rect x="50" y="19.5" width="1.5" height="5"/>
          <rect x="96.5" y="19.5" width="1.5" height="5"/>
        </g>
        <rect x="48.5" y="2.5" width="51" height="39" rx="2" fill="none" stroke-width="1.6"
              class="stroke-marca opacity-0 transition-opacity group-focus-visible:opacity-100"
              :class="elegida === 'f7' && 'opacity-100'"/>
      </g>
      <text x="74" y="42.9" text-anchor="middle" font-size="2.8" font-weight="800" class="pointer-events-none fill-marca-claro font-titulo" x-text="rotulo('f7')">F7</text>
    </g>

    <!-- Techos sugeridos: columnas, cerchas en arco y cumbrera. No reciben toques -->
    <g fill="none" stroke-linecap="round" class="pointer-events-none">
      <g stroke-width="0.7" class="stroke-marca-claro/50">
        <line x1="38.5" y1="28" x2="38.5" y2="20"/>
        <line x1="17.7" y1="40" x2="17.7" y2="32"/>
        <line x1="69.7" y1="46" x2="69.7" y2="38"/>
        <line x1="48.9" y1="58" x2="48.9" y2="50"/>
        <line x1="81.8" y1="47" x2="81.8" y2="39"/>
        <line x1="50.7" y1="65" x2="50.7" y2="57"/>
        <line x1="123.4" y1="71" x2="123.4" y2="63"/>
        <line x1="92.2" y1="89" x2="92.2" y2="81"/>
      </g>
      <g stroke-width="0.5" class="stroke-marca-claro/35">
        <path d="M38.5 20 Q28.1 10 17.7 32"/>
        <path d="M54.1 29 Q43.7 19 33.3 41"/>
        <path d="M69.7 38 Q59.3 28 48.9 50"/>
        <path d="M38.5 20 L69.7 38 M17.7 32 L48.9 50 M28.1 18 L59.3 36"/>
        <path d="M81.8 39 Q66.25 28 50.7 57"/>
        <path d="M102.6 51 Q87 40 71.4 69"/>
        <path d="M123.4 63 Q107.8 52 92.2 81"/>
        <path d="M81.8 39 L123.4 63 M50.7 57 L92.2 81 M66.25 38 L107.8 62"/>
      </g>
    </g>
  </svg>

  <ul class="mt-1 flex flex-wrap gap-x-4 gap-y-2 text-xs text-marca-claro/80">
    <li class="flex items-center gap-2"><span class="h-3 w-3 rounded-sm bg-libre"></span>Libre</li>
    <li class="flex items-center gap-2"><span class="h-3 w-3 rounded-sm bg-slate-400"></span>Ocupada</li>
    <li class="flex items-center gap-2"><span class="h-3 w-3 rounded-sm ring-2 ring-marca"></span>Elegida</li>
  </ul>
  <p class="mt-2 min-h-[1.25rem] text-sm font-medium text-alerta" aria-live="polite" x-text="aviso"></p>
</section>
